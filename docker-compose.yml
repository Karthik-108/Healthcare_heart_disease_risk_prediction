version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: cardiosense-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cardiosense-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://cardiouser:cardiopass@db:5432/cardiosense_db
      - ENVIRONMENT=production
      - RATE_LIMIT_PER_MINUTE=60
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: cardiosense-db
    environment:
      - POSTGRES_USER=cardiouser
      - POSTGRES_PASSWORD=cardiopass
      - POSTGRES_DB=cardiosense_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardiouser -d cardiosense_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: cardiosense-prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

volumes:
  postgres_data:
